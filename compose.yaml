services:
  postgres:
    image: postgres:17
    container_name: lab-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  mage:
    build: .
    container_name: lab-mage
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      USER_CODE_PATH: /home/src/lab_project
    ports:
      - "6789:6789"
    volumes:
      - .:/home/src
    command: /app/run_app.sh mage start lab_project

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lab-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5051:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
