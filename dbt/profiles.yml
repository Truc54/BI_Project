# Dùng chung cho cả trong container Mage (POSTGRES_HOST=postgres, POSTGRES_PORT=5432 từ .env)
# và chạy từ máy host (mặc định localhost:5433 theo compose.yaml).
# Chạy với: dbt run --project-dir dbt --profiles-dir dbt
nyc_taxi_bi:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'labuser') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'password123') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'warehouse') }}"
      schema: public
      threads: 4
