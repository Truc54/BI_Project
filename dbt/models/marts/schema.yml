version: 2

models:
  - name: dim_date
    description: "Bảng chiều ngày lịch bao quát dải ngày 2022-01-01 đến 2024-12-31 kèm ngày mặc định -1."
    columns:
      - name: date_key
        description: "Khóa chính surrogate key dạng YYYYMMDD."
        tests:
          - unique
          - not_null
      - name: full_date
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: month
        tests:
          - not_null

  - name: dim_time
    description: "Bảng chiều thời gian phút trong ngày (1.440 phút từ 0 đến 1439) kèm phút mặc định -1."
    columns:
      - name: time_key
        description: "Khóa chính surrogate key biểu diễn số phút trong ngày (hour*60 + minute)."
        tests:
          - unique
          - not_null
      - name: time_of_day_bucket
        description: "Phân nhóm Daypart: NIGHT, MORN, MID, AFT, EVE theo OD-08."
        tests:
          - not_null

  - name: dim_taxi_zone
    description: "Bảng chiều danh mục 265 vùng Taxi NYC TLC và vùng mặc định -1."
    columns:
      - name: zone_key
        description: "Khóa chính surrogate key (tương ứng location_id)."
        tests:
          - unique
          - not_null
      - name: location_id
        tests:
          - not_null
      - name: borough
        tests:
          - not_null

  - name: dim_vendor
    description: "Bảng chiều nhà cung cấp dịch vụ công nghệ TPEP (1: CMT, 2: VeriFone, 5, 6, -1: Unknown)."
    columns:
      - name: vendor_key
        tests:
          - unique
          - not_null
      - name: vendor_name
        tests:
          - not_null

  - name: dim_rate_code
    description: "Bảng chiều loại biểu giá cước chuyến đi (1..6 chuẩn TLC, 99 đặc biệt, -1: Unknown)."
    columns:
      - name: rate_code_key
        tests:
          - unique
          - not_null
      - name: rate_description
        tests:
          - not_null

  - name: dim_payment_type
    description: "Bảng chiều hình thức thanh toán (0: Chưa có từ điển, 1: Thẻ, 2: Tiền mặt, 3: Miễn phí, 4: Tranh chấp, 5: Chưa rõ, 6: Hủy cuốc, -1: Lỗi)."
    columns:
      - name: payment_type_key
        tests:
          - unique
          - not_null
      - name: payment_description
        tests:
          - not_null
      - name: allows_electronic_tip
        tests:
          - not_null

  - name: dim_passenger_group
    description: "Bảng chiều phân nhóm hành khách (1 người, 2-4 người, 5+ người, Unknown/Zero)."
    columns:
      - name: passenger_group_key
        tests:
          - unique
          - not_null
      - name: passenger_group_name
        tests:
          - not_null

  - name: dim_distance_range
    description: "Bảng chiều phân dải cự ly di chuyển (0-1 dặm, 1-3 dặm, 3-5 dặm, 5-10 dặm, >10 dặm, Invalid/Unknown)."
    columns:
      - name: distance_range_key
        tests:
          - unique
          - not_null
      - name: distance_range_name
        tests:
          - not_null

  - name: fact_yellow_taxi_trip
    description: "Bảng Fact trung tâm lưu trữ toàn bộ các cuốc xe Yellow Taxi (mức hạt 1 dòng = 1 bản ghi nguồn)."
    columns:
      - name: trip_record_key
        description: "Khóa chính surrogate key sinh từ MD5(source_file_month || source_row_number)."
        tests:
          - unique
          - not_null
      - name: source_file_month
        tests:
          - not_null
      - name: source_row_number
        tests:
          - not_null
      - name: pickup_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: dropoff_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: pickup_time_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_time')
              field: time_key
      - name: dropoff_time_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_time')
              field: time_key
      - name: pickup_zone_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_taxi_zone')
              field: zone_key
      - name: dropoff_zone_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_taxi_zone')
              field: zone_key
      - name: vendor_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_vendor')
              field: vendor_key
      - name: rate_code_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_rate_code')
              field: rate_code_key
      - name: payment_type_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_payment_type')
              field: payment_type_key
      - name: passenger_group_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_passenger_group')
              field: passenger_group_key
      - name: distance_range_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_distance_range')
              field: distance_range_key
      - name: trip_record_count
        tests:
          - not_null
      - name: is_in_study_period
        tests:
          - not_null
